name: Build (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA). Defaults to the triggering branch.'
        required: false
        default: ''
        type: string
      mac_arm64:
        description: 'macOS ARM64 (dmg)'
        required: false
        default: false
        type: boolean
      mac_x64:
        description: 'macOS x64 / Intel (dmg)'
        required: false
        default: false
        type: boolean
      win_x64:
        description: 'Windows x64 (portable zip)'
        required: false
        default: false
        type: boolean
      win_arm64:
        description: 'Windows ARM64 (portable zip)'
        required: false
        default: false
        type: boolean
      linux_x64:
        description: 'Linux x64 (AppImage)'
        required: false
        default: false
        type: boolean
      linux_arm64:
        description: 'Linux ARM64 (AppImage)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  XRAY_FALLBACK_VERSION: 'v26.3.27'
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  # Build a matrix from the checked platform boxes.
  # Errors out if no platform is selected.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        run: |
          ALL='[
            {"key":"mac-arm64","selected":${{ inputs.mac_arm64 }},"platform":"macos-latest","os":"darwin","arch":"arm64","xray_asset":"Xray-macos-arm64-v8a.zip","build_cmd":"npm run build:mac"},
            {"key":"mac-x64","selected":${{ inputs.mac_x64 }},"platform":"macos-15-intel","os":"darwin","arch":"x64","xray_asset":"Xray-macos-64.zip","build_cmd":"npm run build:mac"},
            {"key":"win-x64","selected":${{ inputs.win_x64 }},"platform":"windows-latest","os":"win32","arch":"x64","xray_asset":"Xray-windows-64.zip","build_cmd":"npm run build && npx electron-builder --win zip --x64"},
            {"key":"win-arm64","selected":${{ inputs.win_arm64 }},"platform":"windows-latest","os":"win32","arch":"arm64","xray_asset":"Xray-windows-arm64-v8a.zip","build_cmd":"npm run build && npx electron-builder --win zip --arm64"},
            {"key":"linux-x64","selected":${{ inputs.linux_x64 }},"platform":"ubuntu-latest","os":"linux","arch":"x64","xray_asset":"Xray-linux-64.zip","build_cmd":"npm run build:linux"},
            {"key":"linux-arm64","selected":${{ inputs.linux_arm64 }},"platform":"ubuntu-24.04-arm","os":"linux","arch":"arm64","xray_asset":"Xray-linux-arm64-v8a.zip","build_cmd":"npm run build && npx electron-builder --linux --arm64"}
          ]'

          SELECTED=$(echo "$ALL" | jq -c 'map(select(.selected == true))')
          COUNT=$(echo "$SELECTED" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No platform selected. Please tick at least one platform checkbox and re-run."
            exit 1
          fi

          echo "Selected platforms: $(echo "$SELECTED" | jq -r 'map(.key) | join(", ")')"
          echo "matrix={\"include\":$SELECTED}" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - name: Get Xray version
        id: xray
        shell: bash
        run: |
          RESPONSE=$(curl -sL "https://api.github.com/repos/XTLS/Xray-core/releases/latest")
          VER=$(echo "$RESPONSE" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('tag_name',''))" 2>/dev/null || echo "")
          [ -z "$VER" ] && VER="${{ env.XRAY_FALLBACK_VERSION }}"
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Download Xray
        shell: bash
        run: |
          BIN_DIR="resources/bin/${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$BIN_DIR"
          curl -sL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${{ steps.xray.outputs.version }}/${{ matrix.xray_asset }}"
          unzip -o xray.zip -d "$BIN_DIR/" && rm xray.zip
          mv "$BIN_DIR/geoip.dat" "$BIN_DIR/geosite.dat" resources/bin/ 2>/dev/null || true
          rm -f "$BIN_DIR"/{LICENSE,README.md}
          [ "${{ matrix.os }}" != "win32" ] && chmod +x "$BIN_DIR/xray" || true

      - name: Download Chrome
        if: matrix.os != 'linux' || matrix.arch != 'arm64'
        run: npx @puppeteer/browsers install chrome@150.0.7871.115 --path resources/puppeteer

      - name: Download Chrome Beta ARM64
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID='153.0.8010.5'
          ROOT="resources/puppeteer/chrome/linux_arm64-$BUILD_ID"
          mkdir -p "$ROOT"
          curl -fL --retry 3 -o /tmp/chrome-linux-arm64.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$BUILD_ID/linux-arm64/chrome-linux-arm64.zip"
          unzip -q /tmp/chrome-linux-arm64.zip -d "$ROOT"
          rm -f /tmp/chrome-linux-arm64.zip
          chmod +x "$ROOT/chrome-linux-arm64/chrome"

      - name: Build macOS
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 2 ]; then
              export ELECTRON_BUILDER_BINARIES_MIRROR="https://ghproxy.com/https://github.com/"
              echo "macOS build retry #$attempt: using proxy mirror for dmg-builder download."
            fi
            set +e
            npx electron-builder --mac
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$code"
            fi
            echo "::warning::macOS build attempt $attempt failed (exit=$code), retrying after cache clear."
            rm -rf "$ELECTRON_BUILDER_CACHE/downloads"
            sleep 12
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Windows
        if: matrix.os == 'win32'
        shell: pwsh
        run: |
          npm run build
          if ("${{ matrix.arch }}" -eq "arm64") {
            npx electron-builder --win zip --arm64
          } else {
            npx electron-builder --win zip --x64
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Linux
        if: matrix.os == 'linux'
        shell: bash
        run: ${{ matrix.build_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename Windows portable zip
        if: matrix.os == 'win32'
        shell: bash
        run: |
          for file in dist/*.zip; do
            if [ -f "$file" ]; then
              mv "$file" "${file%.zip}-portable.zip"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
